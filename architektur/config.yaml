name: Architektur
version: "2026.9.19.0"
slug: architektur
description: C4 architecture model in Structurizr DSL, read from /config/architektur and rendered live with the state of Home Assistant.
url: "https://github.com/pajew-ski/home-assistant-apps-collection/tree/main/architektur"
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8103
panel_icon: "mdi:sitemap-outline"
panel_title: "Architektur"
panel_admin: true
# Reads /config/architektur only; never writes there, so the git checkout of
# /config stays clean for config_holen.
map:
  - homeassistant_config:ro
# Read-only use: states for live.groovy and the add-on list for drift.
homeassistant_api: true
hassio_api: true
image: "ghcr.io/pajew-ski/home-assistant-apps-collection/{arch}-architektur"
