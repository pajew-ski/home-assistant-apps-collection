# Home Assistant ingress strips its prefix and names it in X-Ingress-Path.
# Structurizr writes absolute paths, so they get the prefix put back here.
daemon on;
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 64;
}

http {
    include /etc/nginx/mime.types;
    access_log off;
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;

    server {
        listen 8103;
        absolute_redirect off;
        # Only the Supervisor's ingress proxy may connect.
        allow 172.30.32.2;
        allow 127.0.0.1;
        deny all;

        location = /_ha/mobil.js {
            alias /etc/architektur/mobil.js;
            default_type application/javascript;
        }

        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host localhost:8080;
            proxy_set_header Accept-Encoding "";
            proxy_redirect ~^https?://[^/]+(/.*)$ $http_x_ingress_path$1;
            proxy_redirect ~^(/.*)$ $http_x_ingress_path$1;

            sub_filter_types application/javascript text/javascript text/css;
            sub_filter_once off;
            sub_filter '"/static/' '"$http_x_ingress_path/static/';
            sub_filter "'/static/" "'$http_x_ingress_path/static/";
            sub_filter '(/static/' '($http_x_ingress_path/static/';
            sub_filter '"/workspace/' '"$http_x_ingress_path/workspace/';
            sub_filter "'/workspace/" "'$http_x_ingress_path/workspace/";
            sub_filter '"/api/' '"$http_x_ingress_path/api/';
            sub_filter "'/api/" "'$http_x_ingress_path/api/";
            sub_filter "'/api'" "'$http_x_ingress_path/api'";
            sub_filter '"/search' '"$http_x_ingress_path/search';
            sub_filter '</body>' '<script src="$http_x_ingress_path/_ha/mobil.js"></script></body>';
        }
    }
}
