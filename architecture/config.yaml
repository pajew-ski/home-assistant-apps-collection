name: Architecture
version: "2026.10.5.3"
slug: architecture
description: C4 architecture model in Structurizr DSL, read from a folder below /config and rendered live with the state of Home Assistant. English and German.
url: "https://github.com/pajew-ski/home-assistant-apps-collection/tree/main/architecture"
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8103
panel_icon: "mdi:sitemap-outline"
panel_title: "Architecture"
panel_admin: true
# Reads /config/<folder> only; never writes there, so a git checkout of
# /config stays clean.
map:
  - homeassistant_config:ro
# Read-only use: states for live.groovy and the add-on list for drift.
homeassistant_api: true
hassio_api: true
options:
  folder: architecture
schema:
  folder: "match(^[A-Za-z0-9_][A-Za-z0-9_.-]*(/[A-Za-z0-9_][A-Za-z0-9_.-]*)*$)"
image: "ghcr.io/pajew-ski/home-assistant-apps-collection/{arch}-architecture"
