# Monthly, grouped, merged by hand (SOP Abhängigkeiten in pajew-ski/data).
# Only the Structurizr base image so far; the actions of this repository
# follow with pajew-ski/data#423.
version: 2
updates:
  - package-ecosystem: docker
    directory: /architektur
    schedule:
      interval: monthly
    groups:
      architektur:
        patterns: ["*"]
