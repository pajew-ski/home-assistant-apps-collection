# Monthly, grouped, merged by hand, no automerge.
version: 2
updates:
  - package-ecosystem: docker
    directory: /architecture
    schedule:
      interval: monthly
    groups:
      architecture:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
