# Monthly, grouped, merged by hand (SOP Abhängigkeiten in pajew-ski/data).
# Only the Temurin base images of architecture/ so far; the actions of this repository
# follow with pajew-ski/data#423.
version: 2
updates:
  - package-ecosystem: docker
    directory: /architecture
    schedule:
      interval: monthly
    groups:
      architecture:
        patterns: ["*"]
