name: Sync Add-ons

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      addon:
        description: 'Add-on slug to sync (leave empty for all)'
        required: false
        default: ''
      force:
        description: 'Force rebuild even if version has not changed'
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout collection
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # prompts – https://github.com/pajew-ski/prompts
      # -----------------------------------------------------------------------
      - name: Check prompts for updates
        id: prompts
        if: ${{ github.event.inputs.addon == '' || github.event.inputs.addon == 'prompts' }}
        run: |
          UPSTREAM_VERSION=$(curl -sf \
            https://raw.githubusercontent.com/pajew-ski/prompts/main/config.yaml \
            | grep '^version:' | awk '{print $2}' | tr -d '"')

          CURRENT_VERSION=$(grep '^version:' prompts/config.yaml \
            | awk '{print $2}' | tr -d '"')

          echo "upstream=$UPSTREAM_VERSION" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT_VERSION"   >> "$GITHUB_OUTPUT"

          if [ "$UPSTREAM_VERSION" != "$CURRENT_VERSION" ] \
             || [ "${{ inputs.force }}" = "true" ]; then
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
            echo "Update needed: $CURRENT_VERSION → $UPSTREAM_VERSION"
          else
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
            echo "Already up-to-date at $CURRENT_VERSION"
          fi

      - name: Sync prompts config files
        if: steps.prompts.outputs.needs_update == 'true'
        run: |
          BASE_URL="https://raw.githubusercontent.com/pajew-ski/prompts/main"

          # Always sync build.yaml (strip unsupported archs)
          curl -sf "$BASE_URL/build.yaml" -o prompts/build.yaml
          sed -i '/^\s*armhf:/d; /^\s*i386:/d' prompts/build.yaml

          # Sync upstream config.yaml and inject image reference
          UPSTREAM_CONFIG=$(curl -sf "$BASE_URL/config.yaml")
          echo "$UPSTREAM_CONFIG" > prompts/config.yaml

          # Strip unsupported architectures from arch list
          sed -i '/^\s*- armhf$/d; /^\s*- i386$/d' prompts/config.yaml

          # Add image field if not already present
          if ! grep -q '^image:' prompts/config.yaml; then
            echo 'image: "ghcr.io/${{ github.repository_owner }}/home-assistant-apps-collection/{arch}-prompts"' \
              >> prompts/config.yaml
          fi

          # Sync optional display assets (ignore 404s)
          curl -sf "$BASE_URL/icon.png" -o prompts/icon.png  2>/dev/null || true
          curl -sf "$BASE_URL/logo.png" -o prompts/logo.png  2>/dev/null || true

      - name: Build and push prompts Docker images
        if: steps.prompts.outputs.needs_update == 'true'
        env:
          VERSION: ${{ steps.prompts.outputs.upstream }}
          REGISTRY: ghcr.io/${{ github.repository_owner }}/home-assistant-apps-collection
        run: |
          git clone --depth 1 https://github.com/pajew-ski/prompts /tmp/prompts-source

          declare -A PLATFORM_MAP=(
            [amd64]=linux/amd64
            [aarch64]=linux/arm64
            [armv7]=linux/arm/v7
            [armhf]=linux/arm/v6
            [i386]=linux/386
          )

          for ARCH in amd64 aarch64 armv7; do
            BASE_IMAGE="ghcr.io/home-assistant/${ARCH}-base:latest"
            PLATFORM="${PLATFORM_MAP[$ARCH]}"
            IMAGE_TAG="${REGISTRY}/${ARCH}-prompts"

            echo "Building $IMAGE_TAG:$VERSION for $PLATFORM …"
            docker buildx build \
              --platform "$PLATFORM" \
              --build-arg BUILD_FROM="$BASE_IMAGE" \
              --tag "${IMAGE_TAG}:${VERSION}" \
              --tag "${IMAGE_TAG}:latest" \
              --push \
              /tmp/prompts-source
          done

      - name: Make prompts packages public
        if: ${{ github.event.inputs.addon == '' || github.event.inputs.addon == 'prompts' }}
        env:
          GH_TOKEN: ${{ secrets.PAT_PACKAGES || secrets.GITHUB_TOKEN }}
        run: |
          for ARCH in amd64 aarch64 armv7; do
            PACKAGE="home-assistant-apps-collection%2F${ARCH}-prompts"
            gh api --method PATCH \
              -H "Accept: application/vnd.github+json" \
              "/user/packages/container/${PACKAGE}" \
              -f visibility=public \
              2>/dev/null \
              && echo "${ARCH}-prompts → public" \
              || echo "${ARCH}-prompts: visibility update skipped (may already be public or token lacks scope)"
          done

      - name: Commit and push changes
        if: steps.prompts.outputs.needs_update == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prompts/
          git diff --cached --quiet || \
            git commit -m "chore(prompts): sync to v${{ steps.prompts.outputs.upstream }}"
          git push

      # -----------------------------------------------------------------------
      # open-entrainer – https://github.com/pajew-ski/open-entrainer
      # -----------------------------------------------------------------------
      - name: Check open-entrainer for updates
        id: open_entrainer
        if: ${{ github.event.inputs.addon == '' || github.event.inputs.addon == 'open-entrainer' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          API_RESPONSE=$(curl -sf \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/pajew-ski/open-entrainer/commits?path=index.html&per_page=1")

          UPSTREAM_VERSION=$(echo "$API_RESPONSE" | python3 -c \
            'import sys,json; d=json.load(sys.stdin)[0]["commit"]["committer"]["date"][:10].split("-"); print(d[0]+"."+str(int(d[1]))+"."+str(int(d[2])))')

          CURRENT_VERSION=$(grep '^version:' open-entrainer/config.yaml \
            | awk '{print $2}' | tr -d '"')

          echo "upstream=$UPSTREAM_VERSION" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT_VERSION"   >> "$GITHUB_OUTPUT"

          if [ "$UPSTREAM_VERSION" != "$CURRENT_VERSION" ] \
             || [ "${{ inputs.force }}" = "true" ]; then
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
            echo "Update needed: $CURRENT_VERSION → $UPSTREAM_VERSION"
          else
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
            echo "Already up-to-date at $CURRENT_VERSION"
          fi

      - name: Build and push open-entrainer Docker images
        if: steps.open_entrainer.outputs.needs_update == 'true'
        env:
          VERSION: ${{ steps.open_entrainer.outputs.upstream }}
          REGISTRY: ghcr.io/${{ github.repository_owner }}/home-assistant-apps-collection
        run: |
          export BUILD_DIR=$(mktemp -d)

          curl -sf \
            "https://raw.githubusercontent.com/pajew-ski/open-entrainer/main/index.html" \
            -o "$BUILD_DIR/index.html"

          python3 -c 'import os; open(os.environ["BUILD_DIR"]+"/Dockerfile","w").write("ARG BUILD_FROM\nFROM ${BUILD_FROM}\nRUN apk add --no-cache nginx\nRUN echo \"server { listen 8100; root /www; index index.html; }\" > /etc/nginx/http.d/default.conf\nCOPY index.html /www/index.html\nEXPOSE 8100\nENTRYPOINT []\nCMD [\"nginx\", \"-g\", \"daemon off;\"]\n")'

          declare -A PLATFORM_MAP=(
            [amd64]=linux/amd64
            [aarch64]=linux/arm64
            [armv7]=linux/arm/v7
          )

          for ARCH in amd64 aarch64 armv7; do
            BASE_IMAGE="ghcr.io/home-assistant/${ARCH}-base:latest"
            PLATFORM="${PLATFORM_MAP[$ARCH]}"
            IMAGE_TAG="${REGISTRY}/${ARCH}-open-entrainer"

            echo "Building $IMAGE_TAG:$VERSION for $PLATFORM …"
            docker buildx build \
              --platform "$PLATFORM" \
              --build-arg BUILD_FROM="$BASE_IMAGE" \
              --tag "${IMAGE_TAG}:${VERSION}" \
              --tag "${IMAGE_TAG}:latest" \
              --push \
              "$BUILD_DIR"
          done

          # Update version in config.yaml
          sed -i "s/^version:.*/version: \"$VERSION\"/" open-entrainer/config.yaml

      - name: Make open-entrainer packages public
        if: ${{ github.event.inputs.addon == '' || github.event.inputs.addon == 'open-entrainer' }}
        env:
          GH_TOKEN: ${{ secrets.PAT_PACKAGES || secrets.GITHUB_TOKEN }}
        run: |
          for ARCH in amd64 aarch64 armv7; do
            PACKAGE="home-assistant-apps-collection%2F${ARCH}-open-entrainer"
            gh api --method PATCH \
              -H "Accept: application/vnd.github+json" \
              "/user/packages/container/${PACKAGE}" \
              -f visibility=public \
              2>/dev/null \
              && echo "${ARCH}-open-entrainer → public" \
              || echo "${ARCH}-open-entrainer: visibility update skipped (may already be public or token lacks scope)"
          done

      - name: Commit and push open-entrainer changes
        if: steps.open_entrainer.outputs.needs_update == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add open-entrainer/
          git diff --cached --quiet || \
            git commit -m "chore(open-entrainer): sync to v${{ steps.open_entrainer.outputs.upstream }}"
          git push

      # -----------------------------------------------------------------------
      # open-desensitizer – https://github.com/pajew-ski/open-desensitizer
      # -----------------------------------------------------------------------
      - name: Check open-desensitizer for updates
        id: open_desensitizer
        if: ${{ github.event.inputs.addon == '' || github.event.inputs.addon == 'open-desensitizer' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          API_RESPONSE=$(curl -sf \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/pajew-ski/open-desensitizer/commits?path=index.html&per_page=1")

          UPSTREAM_VERSION=$(echo "$API_RESPONSE" | python3 -c \
            'import sys,json; d=json.load(sys.stdin)[0]["commit"]["committer"]["date"][:10].split("-"); print(d[0]+"."+str(int(d[1]))+"."+str(int(d[2])))')

          CURRENT_VERSION=$(grep '^version:' open-desensitizer/config.yaml \
            | awk '{print $2}' | tr -d '"')

          echo "upstream=$UPSTREAM_VERSION" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT_VERSION"   >> "$GITHUB_OUTPUT"

          if [ "$UPSTREAM_VERSION" != "$CURRENT_VERSION" ] \
             || [ "${{ inputs.force }}" = "true" ]; then
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
            echo "Update needed: $CURRENT_VERSION → $UPSTREAM_VERSION"
          else
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
            echo "Already up-to-date at $CURRENT_VERSION"
          fi

      - name: Build and push open-desensitizer Docker images
        if: steps.open_desensitizer.outputs.needs_update == 'true'
        env:
          VERSION: ${{ steps.open_desensitizer.outputs.upstream }}
          REGISTRY: ghcr.io/${{ github.repository_owner }}/home-assistant-apps-collection
        run: |
          export BUILD_DIR=$(mktemp -d)

          curl -sf \
            "https://raw.githubusercontent.com/pajew-ski/open-desensitizer/main/index.html" \
            -o "$BUILD_DIR/index.html"

          python3 -c 'import os; open(os.environ["BUILD_DIR"]+"/Dockerfile","w").write("ARG BUILD_FROM\nFROM ${BUILD_FROM}\nRUN apk add --no-cache nginx\nRUN echo \"server { listen 8101; root /www; index index.html; }\" > /etc/nginx/http.d/default.conf\nCOPY index.html /www/index.html\nEXPOSE 8101\nENTRYPOINT []\nCMD [\"nginx\", \"-g\", \"daemon off;\"]\n")'

          declare -A PLATFORM_MAP=(
            [amd64]=linux/amd64
            [aarch64]=linux/arm64
            [armv7]=linux/arm/v7
          )

          for ARCH in amd64 aarch64 armv7; do
            BASE_IMAGE="ghcr.io/home-assistant/${ARCH}-base:latest"
            PLATFORM="${PLATFORM_MAP[$ARCH]}"
            IMAGE_TAG="${REGISTRY}/${ARCH}-open-desensitizer"

            echo "Building $IMAGE_TAG:$VERSION for $PLATFORM …"
            docker buildx build \
              --platform "$PLATFORM" \
              --build-arg BUILD_FROM="$BASE_IMAGE" \
              --tag "${IMAGE_TAG}:${VERSION}" \
              --tag "${IMAGE_TAG}:latest" \
              --push \
              "$BUILD_DIR"
          done

          # Update version in config.yaml
          sed -i "s/^version:.*/version: \"$VERSION\"/" open-desensitizer/config.yaml

      - name: Make open-desensitizer packages public
        if: ${{ github.event.inputs.addon == '' || github.event.inputs.addon == 'open-desensitizer' }}
        env:
          GH_TOKEN: ${{ secrets.PAT_PACKAGES || secrets.GITHUB_TOKEN }}
        run: |
          for ARCH in amd64 aarch64 armv7; do
            PACKAGE="home-assistant-apps-collection%2F${ARCH}-open-desensitizer"
            gh api --method PATCH \
              -H "Accept: application/vnd.github+json" \
              "/user/packages/container/${PACKAGE}" \
              -f visibility=public \
              2>/dev/null \
              && echo "${ARCH}-open-desensitizer → public" \
              || echo "${ARCH}-open-desensitizer: visibility update skipped (may already be public or token lacks scope)"
          done

      - name: Commit and push open-desensitizer changes
        if: steps.open_desensitizer.outputs.needs_update == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add open-desensitizer/
          git diff --cached --quiet || \
            git commit -m "chore(open-desensitizer): sync to v${{ steps.open_desensitizer.outputs.upstream }}"
          git push

      # -----------------------------------------------------------------------
      # exocortex – custom dockerfile (self-contained in this repo)
      # -----------------------------------------------------------------------
      - name: Check exocortex for updates
        id: exocortex
        if: ${{ github.event.inputs.addon == '' || github.event.inputs.addon == 'exocortex' }}
        run: |
          CURRENT_VERSION=$(grep '^version:' exocortex/config.yaml \
            | awk '{print $2}' | tr -d '"')
          CURRENT_UPSTREAM=$(echo "$CURRENT_VERSION" | sed 's/\.[0-9]*$//')
          PACKAGING_VER=$(echo "$CURRENT_VERSION" | sed 's/.*\.\([0-9]*\)$/\1/')

          echo "upstream=$CURRENT_UPSTREAM"           >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT_VERSION"             >> "$GITHUB_OUTPUT"

          if [ "${{ inputs.force }}" = "true" ]; then
            NEW_VERSION="${CURRENT_UPSTREAM}.$((PACKAGING_VER + 1))"
            echo "needs_update=true"                  >> "$GITHUB_OUTPUT"
            echo "new_version=$NEW_VERSION"           >> "$GITHUB_OUTPUT"
            echo "Force rebuild: $CURRENT_VERSION → $NEW_VERSION"
          else
            echo "needs_update=false"                 >> "$GITHUB_OUTPUT"
            echo "new_version=$CURRENT_VERSION"       >> "$GITHUB_OUTPUT"
            echo "Already up-to-date at $CURRENT_VERSION"
          fi

      - name: Build and push exocortex Docker images
        if: steps.exocortex.outputs.needs_update == 'true'
        env:
          NEW_VERSION: ${{ steps.exocortex.outputs.new_version }}
          REGISTRY: ghcr.io/${{ github.repository_owner }}/home-assistant-apps-collection
        run: |
          declare -A PLATFORM_MAP=(
            [amd64]=linux/amd64
            [aarch64]=linux/arm64
          )

          for ARCH in amd64 aarch64; do
            BASE_IMAGE="ghcr.io/home-assistant/${ARCH}-base-ubuntu:latest"
            PLATFORM="${PLATFORM_MAP[$ARCH]}"
            IMAGE_TAG="${REGISTRY}/${ARCH}-exocortex"

            echo "Building $IMAGE_TAG:$NEW_VERSION for $PLATFORM …"
            docker buildx build \
              --platform "$PLATFORM" \
              --build-arg BUILD_FROM="$BASE_IMAGE" \
              --build-arg BUILD_ARCH="$ARCH" \
              --build-arg EXOCORTEX_VERSION="${NEW_VERSION}" \
              --tag "${IMAGE_TAG}:${NEW_VERSION}" \
              --tag "${IMAGE_TAG}:latest" \
              --push \
              exocortex/
          done

          # Write the packaging version into config.yaml
          sed -i "s/^version:.*/version: \"$NEW_VERSION\"/" exocortex/config.yaml

      - name: Make exocortex packages public
        if: ${{ github.event.inputs.addon == '' || github.event.inputs.addon == 'exocortex' }}
        env:
          GH_TOKEN: ${{ secrets.PAT_PACKAGES || secrets.GITHUB_TOKEN }}
        run: |
          for ARCH in amd64 aarch64; do
            PACKAGE="home-assistant-apps-collection%2F${ARCH}-exocortex"
            gh api --method PATCH \
              -H "Accept: application/vnd.github+json" \
              "/user/packages/container/${PACKAGE}" \
              -f visibility=public \
              2>/dev/null \
              && echo "${ARCH}-exocortex → public" \
              || echo "${ARCH}-exocortex: visibility update skipped (may already be public or token lacks scope)"
          done

      - name: Commit and push exocortex changes
        if: steps.exocortex.outputs.needs_update == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add exocortex/
          git diff --cached --quiet || \
            git commit -m "chore(exocortex): rebuild v${{ steps.exocortex.outputs.new_version }}"
          git push

  # ---------------------------------------------------------------------------
  # open-workspace – https://github.com/pajew-ski/open-workspace
  #
  # Eigene Jobs statt Schritte im sync-Job:
  # - Der Build (bun install + next build) läuft nativ je Architektur;
  #   aarch64 unter QEMU wäre langsam und bun unter Emulation unzuverlässig.
  # - Upstream führt keine Versionsnummer pro Änderung (config.yaml bleibt
  #   auf 0.1.0). Die Add-on-Version ist deshalb
  #   {upstream_version}.{Commit-Zeitpunkt YYYYMMDDHHMM} des gebauten Commits.
  # - Gebaut wird nur ein Commit, dessen Upstream-CI grün ist, und nur, wenn
  #   sich seit dem zuletzt gebauten Commit (open-workspace/.upstream-sha)
  #   etwas geändert hat, das im Image oder im Add-on-Manifest landet.
  # - Die config.yaml wird erst nach erfolgreichem Push aller Images
  #   committet: Home Assistant sieht nie eine Version ohne Image.
  # ---------------------------------------------------------------------------
  open-workspace-check:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.addon == '' || github.event.inputs.addon == 'open-workspace' }}
    outputs:
      needs_update: ${{ steps.check.outputs.needs_update }}
      sha: ${{ steps.check.outputs.sha }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout collection
        uses: actions/checkout@v4

      - name: Check open-workspace for updates
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          API=https://api.github.com/repos/pajew-ski/open-workspace
          api() { curl -sf -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API/$1"; }

          HEAD_JSON=$(api commits/main)
          SHA=$(jq -r .sha <<<"$HEAD_JSON")
          COMMIT_DATE=$(jq -r .commit.committer.date <<<"$HEAD_JSON")
          LAST_SHA=$(cat open-workspace/.upstream-sha 2>/dev/null || true)

          UPSTREAM_VERSION=$(curl -sf \
            "https://raw.githubusercontent.com/pajew-ski/open-workspace/$SHA/deploy/ha-addon/config.yaml" \
            | grep '^version:' | awk '{print $2}' | tr -d '"')
          STAMP=$(date -u -d "$COMMIT_DATE" +%Y%m%d%H%M)
          # Erzwungener Neubau desselben Commits braucht eine neue Version,
          # sonst bietet Home Assistant kein Update an.
          if [ "$FORCE" = "true" ] && [ "$SHA" = "$LAST_SHA" ]; then
            STAMP=$(date -u +%Y%m%d%H%M)
          fi
          VERSION="${UPSTREAM_VERSION}.${STAMP}"

          echo "sha=$SHA"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          skip() { echo "needs_update=false" >> "$GITHUB_OUTPUT"; echo "$1"; exit 0; }

          if [ "$FORCE" != "true" ]; then
            [ "$SHA" = "$LAST_SHA" ] && skip "Already up-to-date at ${SHA:0:7}"

            # Nur Änderungen, die ins Image oder ins Manifest gehen, lösen
            # einen Neubau aus. Unbekannter Vorgänger (erster Lauf, Upstream-
            # History umgeschrieben) oder >= 300 Dateien: neu bauen.
            RELEVANT='^(src|scripts|public|seed|ontology|deploy/ha-addon)/|^(Dockerfile|\.dockerignore|package\.json|bun\.lock|next\.config\.ts|tsconfig\.json)$'
            if [ -n "$LAST_SHA" ] && COMPARE=$(api "compare/${LAST_SHA}...${SHA}"); then
              FILES=$(jq -r '.files[].filename' <<<"$COMPARE")
              COUNT=$(jq '.files | length' <<<"$COMPARE")
              if [ "$COUNT" -lt 300 ] && ! grep -qE "$RELEVANT" <<<"$FILES"; then
                skip "No image-relevant changes in ${LAST_SHA:0:7}..${SHA:0:7}"
              fi
            fi
          fi

          # Upstream-CI muss für genau diesen Commit abgeschlossen und grün
          # sein. Läuft sie noch, holt der nächste Lauf das Update nach.
          RUNS=$(api "commits/$SHA/check-runs?per_page=100")
          TOTAL=$(jq '.total_count' <<<"$RUNS")
          PENDING=$(jq '[.check_runs[] | select(.status != "completed")] | length' <<<"$RUNS")
          FAILED=$(jq -r '[.check_runs[] | select(.status == "completed" and (.conclusion | IN("success", "skipped", "neutral") | not)) | .name] | join(", ")' <<<"$RUNS")
          [ "$TOTAL" -eq 0 ] && skip "Upstream CI has not reported for ${SHA:0:7} yet"
          [ "$PENDING" -gt 0 ] && skip "Upstream CI still running for ${SHA:0:7}"
          if [ -n "$FAILED" ]; then
            echo "::warning::open-workspace ${SHA:0:7} not mirrored, upstream CI failed: $FAILED"
            skip "Upstream CI failed for ${SHA:0:7}"
          fi

          echo "needs_update=true" >> "$GITHUB_OUTPUT"
          echo "Update needed: ${LAST_SHA:0:7} → ${SHA:0:7} (v$VERSION)"

  open-workspace-build:
    needs: open-workspace-check
    if: needs.open-workspace-check.outputs.needs_update == 'true'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout open-workspace
        uses: actions/checkout@v4
        with:
          repository: pajew-ski/open-workspace
          ref: ${{ needs.open-workspace-check.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Upstream-Dockerfile ohne BUILD_FROM: es bringt seine eigenen
      # Basis-Images mit (oven/bun, node:22-alpine) — daher nur amd64/aarch64.
      - name: Build and push open-workspace ${{ matrix.arch }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/home-assistant-apps-collection/${{ matrix.arch }}-open-workspace:${{ needs.open-workspace-check.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/home-assistant-apps-collection/${{ matrix.arch }}-open-workspace:latest
          cache-from: type=gha,scope=open-workspace-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=open-workspace-${{ matrix.arch }}

  open-workspace-publish:
    # Nach dem sync-Job, damit beide nicht gleichzeitig auf den Branch pushen;
    # dessen Ergebnis spielt keine Rolle.
    needs: [sync, open-workspace-check, open-workspace-build]
    if: ${{ !cancelled() && needs.open-workspace-check.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.open-workspace-build.result) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout collection
        uses: actions/checkout@v4

      - name: Make open-workspace packages public
        env:
          GH_TOKEN: ${{ secrets.PAT_PACKAGES || secrets.GITHUB_TOKEN }}
        run: |
          for ARCH in amd64 aarch64; do
            PACKAGE="home-assistant-apps-collection%2F${ARCH}-open-workspace"
            gh api --method PATCH \
              -H "Accept: application/vnd.github+json" \
              "/user/packages/container/${PACKAGE}" \
              -f visibility=public \
              2>/dev/null \
              && echo "${ARCH}-open-workspace → public" \
              || echo "${ARCH}-open-workspace: visibility update skipped (may already be public or token lacks scope)"
          done

      - name: Sync open-workspace config files
        if: needs.open-workspace-check.outputs.needs_update == 'true'
        env:
          SHA: ${{ needs.open-workspace-check.outputs.sha }}
          VERSION: ${{ needs.open-workspace-check.outputs.version }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/home-assistant-apps-collection/{arch}-open-workspace
        run: |
          set -euo pipefail
          BASE_URL="https://raw.githubusercontent.com/pajew-ski/open-workspace/$SHA"
          mkdir -p open-workspace

          # Manifest liegt upstream unter deploy/ha-addon/. Dessen image-Feld
          # zeigt auf ein Image, das upstream nicht baut: ersetzen.
          curl -sf "$BASE_URL/deploy/ha-addon/config.yaml" -o open-workspace/config.yaml
          sed -i -E \
            -e "s|^image:.*|image: \"$IMAGE\"|" \
            -e "s|^version:.*|version: \"$VERSION\"|" \
            -e '/^\s*- (armv7|armhf|i386)\s*$/d' \
            open-workspace/config.yaml
          grep -q '^image:' open-workspace/config.yaml \
            || echo "image: \"$IMAGE\"" >> open-workspace/config.yaml
          grep -q "^version: \"$VERSION\"$" open-workspace/config.yaml

          # Relative Links in DOCS.md zeigen upstream ins Repo.
          curl -sf "$BASE_URL/deploy/ha-addon/DOCS.md" \
            | sed -E 's#\]\(\.\./\.\./#](https://github.com/pajew-ski/open-workspace/blob/main/#g' \
            > open-workspace/DOCS.md

          curl -sf "$BASE_URL/public/icons/icon-192.png" -o open-workspace/icon.png || true

          echo "$SHA" > open-workspace/.upstream-sha

      - name: Commit and push open-workspace changes
        if: needs.open-workspace-check.outputs.needs_update == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add open-workspace/
          git diff --cached --quiet && exit 0
          git commit -m "chore(open-workspace): sync to v${{ needs.open-workspace-check.outputs.version }}"
          for DELAY in 2 4 8 16; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep "$DELAY"
          done
          exit 1
