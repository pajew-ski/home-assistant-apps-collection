name: Sync Add-ons

# Keeps every add-on in this collection at the state of its source.
#
# Triggers:
# - repository_dispatch "upstream-changed": a source repository sends it right
#   after a merge to main (its notify workflow), with the slug as payload.
# - schedule: hourly fallback. Every check compares against what was built
#   last, so a run without changes only reads a few API endpoints.
# - push to main under exocortex/: a version bump there is built at once.
# - workflow_dispatch: by hand, for one add-on or all, optionally forced.
#
# Pushes to main come from several jobs; each one rebases and retries, and the
# concurrency group keeps two runs from interleaving.

on:
  repository_dispatch:
    types: [upstream-changed]
  push:
    branches: [main]
    paths: ['exocortex/**']
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      addon:
        description: 'Add-on slug to sync (leave empty for all)'
        required: false
        default: ''
      force:
        description: 'Force rebuild even if nothing has changed'
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: sync-addons
  cancel-in-progress: false

env:
  # Which add-on to look at (empty: all) and whether to rebuild regardless,
  # from either a manual run or a dispatch payload.
  ADDON: ${{ inputs.addon || github.event.client_payload.slug || '' }}
  FORCE: ${{ inputs.force || github.event.client_payload.force || false }}
  REGISTRY: ghcr.io/${{ github.repository_owner }}/home-assistant-apps-collection

jobs:
  # ---------------------------------------------------------------------------
  # Static apps – prompts, open-entrainer, open-desensitizer, open-helix
  #
  # Each upstream is one index.html. The image is that file behind nginx
  # (static-app/Dockerfile), built for every arch in the add-on's config.yaml.
  # - Check: the newest upstream commit that touched index.html, against
  #   <slug>/.upstream-sha. Version: commit time as YYYY.M.D.HHMM, so every
  #   merge gets its own version and Home Assistant offers it.
  # - Build: one matrix leg per app; a failing app does not hold back others.
  # - Publish: config.yaml and .upstream-sha are committed only for apps whose
  #   images were all pushed, so Home Assistant never sees a version without
  #   an image.
  # ---------------------------------------------------------------------------
  static-check:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.check.outputs.matrix }}
      any: ${{ steps.check.outputs.any }}
    steps:
      - name: Checkout collection
        uses: actions/checkout@v5

      - name: Check static apps for updates
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/static_apps.py check

  static-build:
    needs: static-check
    if: needs.static-check.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.static-check.outputs.matrix) }}
    name: static-build (${{ matrix.slug }})
    steps:
      - name: Checkout collection
        uses: actions/checkout@v5

      - name: Set up QEMU (multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.slug }} images
        env:
          SLUG: ${{ matrix.slug }}
          REPO: ${{ matrix.repo }}
          SHA: ${{ matrix.sha }}
          VERSION: ${{ matrix.version }}
          PORT: ${{ matrix.port }}
          ARCHS: ${{ matrix.archs }}
        run: |
          set -euo pipefail
          BUILD_DIR=$(mktemp -d)
          cp static-app/Dockerfile "$BUILD_DIR/"
          curl -sf "https://raw.githubusercontent.com/${REPO}/${SHA}/index.html" -o "$BUILD_DIR/index.html"

          declare -A PLATFORM=([amd64]=linux/amd64 [aarch64]=linux/arm64 [armv7]=linux/arm/v7)
          for ARCH in $ARCHS; do
            IMAGE="${REGISTRY}/${ARCH}-${SLUG}"
            echo "Building ${IMAGE}:${VERSION} for ${PLATFORM[$ARCH]}"
            docker buildx build \
              --platform "${PLATFORM[$ARCH]}" \
              --build-arg BUILD_FROM="ghcr.io/home-assistant/${ARCH}-base:latest" \
              --build-arg BUILD_ARCH="$ARCH" \
              --build-arg BUILD_VERSION="$VERSION" \
              --build-arg PORT="$PORT" \
              --provenance=false \
              --tag "${IMAGE}:${VERSION}" \
              --tag "${IMAGE}:latest" \
              --push \
              "$BUILD_DIR"
          done

          mkdir -p built
          jq -n --arg slug "$SLUG" --arg version "$VERSION" --arg sha "$SHA" --arg archs "$ARCHS" \
            '{slug: $slug, version: $version, sha: $sha, archs: $archs}' > "built/${SLUG}.json"

      - name: Record the build
        uses: actions/upload-artifact@v4
        with:
          name: built-${{ matrix.slug }}
          path: built/${{ matrix.slug }}.json
          retention-days: 1

  static-publish:
    needs: [static-check, static-build]
    if: ${{ !cancelled() && needs.static-check.outputs.any == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout collection
        uses: actions/checkout@v5

      - name: Collect the builds that succeeded
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: built-*
          path: built
          merge-multiple: true

      - name: Write versions
        id: publish
        run: python3 .github/scripts/static_apps.py publish

      - name: Check that the images are public
        run: |
          IMAGES=$(jq -r --arg reg "${REGISTRY#ghcr.io/}" '.slug as $s | .archs | split(" ")[] | "\($reg)/\(.)-\($s)"' built/*.json 2>/dev/null || true)
          [ -z "$IMAGES" ] || .github/scripts/check-public.sh $IMAGES

      - name: Commit and push static app changes
        if: steps.publish.outputs.summary != ''
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- $(jq -r '.slug' built/*.json)
          git diff --cached --quiet && exit 0
          git commit -m "chore(static apps): sync ${{ steps.publish.outputs.summary }}"
          for DELAY in 2 4 8 16; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep "$DELAY"
          done
          exit 1

  # ---------------------------------------------------------------------------
  # exocortex – custom Dockerfile, self-contained in this repo
  #
  # Code changes bump the {semver} part of exocortex/config.yaml by hand. A
  # version whose images are not in the registry yet is built; a forced run
  # increments the packaging suffix and rebuilds.
  # ---------------------------------------------------------------------------
  exocortex:
    if: ${{ (inputs.addon || github.event.client_payload.slug || '') == '' || (inputs.addon || github.event.client_payload.slug) == 'exocortex' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout collection
        uses: actions/checkout@v5

      - name: Check exocortex for updates
        id: exocortex
        run: |
          CURRENT_VERSION=$(grep '^version:' exocortex/config.yaml \
            | awk '{print $2}' | tr -d '"')
          CURRENT_UPSTREAM=$(echo "$CURRENT_VERSION" | sed 's/\.[0-9]*$//')
          PACKAGING_VER=$(echo "$CURRENT_VERSION" | sed 's/.*\.\([0-9]*\)$/\1/')

          # Is the image of this exact version in the registry, for every arch?
          published() {
            local repo="${REGISTRY#ghcr.io/}/$1-exocortex" token
            token=$(curl -sf "https://ghcr.io/token?scope=repository:${repo}:pull" | jq -r '.token // empty')
            [ -n "$token" ] && curl -sfI -H "Authorization: Bearer $token" \
              -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json" \
              "https://ghcr.io/v2/${repo}/manifests/${CURRENT_VERSION}" >/dev/null
          }

          if [ "$FORCE" = "true" ]; then
            NEW_VERSION="${CURRENT_UPSTREAM}.$((PACKAGING_VER + 1))"
            echo "needs_update=true"        >> "$GITHUB_OUTPUT"
            echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
            echo "Force rebuild: $CURRENT_VERSION → $NEW_VERSION"
          elif ! published amd64 || ! published aarch64; then
            echo "needs_update=true"            >> "$GITHUB_OUTPUT"
            echo "new_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
            echo "No image for $CURRENT_VERSION yet: building it"
          else
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
            echo "Already up-to-date at $CURRENT_VERSION"
          fi

      - name: Set up QEMU (multi-arch builds)
        if: steps.exocortex.outputs.needs_update == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.exocortex.outputs.needs_update == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: steps.exocortex.outputs.needs_update == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push exocortex Docker images
        if: steps.exocortex.outputs.needs_update == 'true'
        env:
          NEW_VERSION: ${{ steps.exocortex.outputs.new_version }}
        run: |
          set -euo pipefail
          declare -A PLATFORM=([amd64]=linux/amd64 [aarch64]=linux/arm64)
          for ARCH in amd64 aarch64; do
            IMAGE="${REGISTRY}/${ARCH}-exocortex"
            echo "Building ${IMAGE}:${NEW_VERSION} for ${PLATFORM[$ARCH]}"
            docker buildx build \
              --platform "${PLATFORM[$ARCH]}" \
              --build-arg BUILD_FROM="ghcr.io/home-assistant/${ARCH}-base-ubuntu:latest" \
              --build-arg BUILD_ARCH="$ARCH" \
              --build-arg EXOCORTEX_VERSION="$NEW_VERSION" \
              --tag "${IMAGE}:${NEW_VERSION}" \
              --tag "${IMAGE}:latest" \
              --push \
              exocortex/
          done
          sed -i "s/^version:.*/version: \"$NEW_VERSION\"/" exocortex/config.yaml

      - name: Check that the images are public
        if: steps.exocortex.outputs.needs_update == 'true'
        run: .github/scripts/check-public.sh "${REGISTRY#ghcr.io/}/amd64-exocortex" "${REGISTRY#ghcr.io/}/aarch64-exocortex"

      - name: Commit and push exocortex changes
        if: steps.exocortex.outputs.needs_update == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add exocortex/
          git diff --cached --quiet && exit 0
          git commit -m "chore(exocortex): rebuild v${{ steps.exocortex.outputs.new_version }}"
          for DELAY in 2 4 8 16; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep "$DELAY"
          done
          exit 1

  # ---------------------------------------------------------------------------
  # open-workspace – https://github.com/pajew-ski/open-workspace
  #
  # Own jobs instead of the static path:
  # - The build (bun install + next build) runs natively per arch; aarch64
  #   under QEMU would be slow, and bun under emulation is unreliable.
  # - Upstream keeps no version per change (config.yaml stays at 0.1.0). The
  #   add-on version is {upstream_version}.{commit time YYYYMMDDHHMM}.
  # - Only a commit whose upstream CI is green is built, and only when
  #   something that ends up in the image or the manifest changed since the
  #   last built commit (open-workspace/.upstream-sha).
  # - config.yaml is committed only after all images are pushed.
  # ---------------------------------------------------------------------------
  open-workspace-check:
    if: ${{ (inputs.addon || github.event.client_payload.slug || '') == '' || (inputs.addon || github.event.client_payload.slug) == 'open-workspace' }}
    runs-on: ubuntu-latest
    outputs:
      needs_update: ${{ steps.check.outputs.needs_update }}
      sha: ${{ steps.check.outputs.sha }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout collection
        uses: actions/checkout@v5

      - name: Check open-workspace for updates
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          API=https://api.github.com/repos/pajew-ski/open-workspace
          api() { curl -sf -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API/$1"; }

          HEAD_JSON=$(api commits/main)
          SHA=$(jq -r .sha <<<"$HEAD_JSON")
          COMMIT_DATE=$(jq -r .commit.committer.date <<<"$HEAD_JSON")
          LAST_SHA=$(cat open-workspace/.upstream-sha 2>/dev/null || true)

          UPSTREAM_VERSION=$(curl -sf \
            "https://raw.githubusercontent.com/pajew-ski/open-workspace/$SHA/deploy/ha-addon/config.yaml" \
            | grep '^version:' | awk '{print $2}' | tr -d '"')
          STAMP=$(date -u -d "$COMMIT_DATE" +%Y%m%d%H%M)
          # A forced rebuild of the same commit needs a new version, or Home
          # Assistant offers no update.
          if [ "$FORCE" = "true" ] && [ "$SHA" = "$LAST_SHA" ]; then
            STAMP=$(date -u +%Y%m%d%H%M)
          fi
          VERSION="${UPSTREAM_VERSION}.${STAMP}"

          echo "sha=$SHA"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          skip() { echo "needs_update=false" >> "$GITHUB_OUTPUT"; echo "$1"; exit 0; }

          if [ "$FORCE" != "true" ]; then
            [ "$SHA" = "$LAST_SHA" ] && skip "Already up-to-date at ${SHA:0:7}"

            # Only changes that end up in the image or the manifest trigger a
            # rebuild. Unknown predecessor (first run, rewritten upstream
            # history) or 300 files or more: rebuild.
            RELEVANT='^(src|scripts|public|seed|ontology|deploy/ha-addon)/|^(Dockerfile|\.dockerignore|package\.json|bun\.lock|next\.config\.ts|tsconfig\.json)$'
            if [ -n "$LAST_SHA" ] && COMPARE=$(api "compare/${LAST_SHA}...${SHA}"); then
              FILES=$(jq -r '.files[].filename' <<<"$COMPARE")
              COUNT=$(jq '.files | length' <<<"$COMPARE")
              if [ "$COUNT" -lt 300 ] && ! grep -qE "$RELEVANT" <<<"$FILES"; then
                skip "No image-relevant changes in ${LAST_SHA:0:7}..${SHA:0:7}"
              fi
            fi
          fi

          # Upstream CI must have completed green for exactly this commit. If
          # it is still running, the next run picks the update up.
          RUNS=$(api "commits/$SHA/check-runs?per_page=100")
          TOTAL=$(jq '.total_count' <<<"$RUNS")
          PENDING=$(jq '[.check_runs[] | select(.status != "completed")] | length' <<<"$RUNS")
          FAILED=$(jq -r '[.check_runs[] | select(.status == "completed" and (.conclusion | IN("success", "skipped", "neutral") | not)) | .name] | join(", ")' <<<"$RUNS")
          [ "$TOTAL" -eq 0 ] && skip "Upstream CI has not reported for ${SHA:0:7} yet"
          [ "$PENDING" -gt 0 ] && skip "Upstream CI still running for ${SHA:0:7}"
          if [ -n "$FAILED" ]; then
            echo "::warning::open-workspace ${SHA:0:7} not mirrored, upstream CI failed: $FAILED"
            skip "Upstream CI failed for ${SHA:0:7}"
          fi

          echo "needs_update=true" >> "$GITHUB_OUTPUT"
          echo "Update needed: ${LAST_SHA:0:7} → ${SHA:0:7} (v$VERSION)"

  open-workspace-build:
    needs: open-workspace-check
    if: needs.open-workspace-check.outputs.needs_update == 'true'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout open-workspace
        uses: actions/checkout@v5
        with:
          repository: pajew-ski/open-workspace
          ref: ${{ needs.open-workspace-check.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The upstream Dockerfile takes no BUILD_FROM: it brings its own base
      # images (oven/bun, node:22-alpine), hence amd64 and aarch64 only.
      - name: Build and push open-workspace ${{ matrix.arch }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.arch }}-open-workspace:${{ needs.open-workspace-check.outputs.version }}
            ${{ env.REGISTRY }}/${{ matrix.arch }}-open-workspace:latest
          cache-from: type=gha,scope=open-workspace-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=open-workspace-${{ matrix.arch }}

  open-workspace-publish:
    needs: [open-workspace-check, open-workspace-build]
    if: ${{ !cancelled() && needs.open-workspace-check.outputs.needs_update == 'true' && needs.open-workspace-build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout collection
        uses: actions/checkout@v5

      - name: Sync open-workspace config files
        env:
          SHA: ${{ needs.open-workspace-check.outputs.sha }}
          VERSION: ${{ needs.open-workspace-check.outputs.version }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/home-assistant-apps-collection/{arch}-open-workspace
        run: |
          set -euo pipefail
          BASE_URL="https://raw.githubusercontent.com/pajew-ski/open-workspace/$SHA"
          mkdir -p open-workspace

          # The manifest lives under deploy/ha-addon/ upstream. Its image field
          # points to an image upstream never builds: replace it.
          curl -sf "$BASE_URL/deploy/ha-addon/config.yaml" -o open-workspace/config.yaml
          sed -i -E \
            -e "s|^image:.*|image: \"$IMAGE\"|" \
            -e "s|^version:.*|version: \"$VERSION\"|" \
            -e '/^\s*- (armv7|armhf|i386)\s*$/d' \
            open-workspace/config.yaml
          grep -q '^image:' open-workspace/config.yaml \
            || echo "image: \"$IMAGE\"" >> open-workspace/config.yaml
          grep -q "^version: \"$VERSION\"$" open-workspace/config.yaml

          # Relative links in DOCS.md point into the upstream repository.
          curl -sf "$BASE_URL/deploy/ha-addon/DOCS.md" \
            | sed -E 's#\]\(\.\./\.\./#](https://github.com/pajew-ski/open-workspace/blob/main/#g' \
            > open-workspace/DOCS.md

          curl -sf "$BASE_URL/public/icons/icon-192.png" -o open-workspace/icon.png || true

          echo "$SHA" > open-workspace/.upstream-sha

      - name: Check that the images are public
        run: .github/scripts/check-public.sh "${REGISTRY#ghcr.io/}/amd64-open-workspace" "${REGISTRY#ghcr.io/}/aarch64-open-workspace"

      - name: Commit and push open-workspace changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add open-workspace/
          git diff --cached --quiet && exit 0
          git commit -m "chore(open-workspace): sync to v${{ needs.open-workspace-check.outputs.version }}"
          for DELAY in 2 4 8 16; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep "$DELAY"
          done
          exit 1
